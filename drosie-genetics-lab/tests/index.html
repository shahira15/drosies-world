<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Drosie Genetics Lab — Scientific test suite</title>
<style>body{font:15px/1.5 system-ui,sans-serif;background:#0d1a26;color:#eef5fb;margin:0;padding:24px}h1{margin-top:0}
.pass{color:#8fe388}.fail{color:#ff7a7a}li{margin:4px 0}.kind{font:12px ui-monospace,monospace;color:#86a1b7}
#sum{font-size:1.2rem;font-weight:800;margin:12px 0}a{color:#58d6ff}code{background:#132c40;padding:2px 6px;border-radius:6px}</style></head>
<body><h1>Scientific validation suite</h1>
<p>Runs the same tests as <code>node tests/run-tests.mjs</code>, in your browser. Deterministic tests compare the engine with analytically derived distributions; stochastic tests check convergence of large simulations within ±4 standard errors. <a href="../">← back to the lab</a></p>
<div id="sum">Running…</div><ul id="out"></ul>
<script type="module">
import { runAll } from './engine.tests.js';
const out = document.getElementById('out');
const { results, pass, total } = await runAll(() => {});
for (const r of results) { const li = document.createElement('li'); li.innerHTML = `<b class="${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓ PASS' : '✗ FAIL'}</b> ${r.group} — ${r.name} <span class="kind">[${r.kind}, ${r.ms} ms]</span>${r.pass ? '' : `<br><code>${r.error}</code>`}`; out.appendChild(li); }
const s = document.getElementById('sum'); s.textContent = `${pass} / ${total} tests passed`; s.className = pass === total ? 'pass' : 'fail';
</script></body></html>
